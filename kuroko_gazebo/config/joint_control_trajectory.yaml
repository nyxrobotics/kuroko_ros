# Publish all joint states -----------------------------------
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 1000

# Position Controllers ---------------------------------------
trajectory_controller:
  type: "position_controllers/JointTrajectoryController"
  stop_trajectory_duration: 100
  state_publish_rate: 1000
  action_monitor_rate: 100
  allow_partial_joints_goal: True
  joints:
    - waist_joint
    - shoulder_r_joint
    - arm_r_joint
    - scissor_rf_joint
    - scissor_rr_joint
    - shoulder_l_joint
    - arm_l_joint
    - scissor_lf_joint
    - scissor_lr_joint
    - hip_r_roll_joint
    - hip_r_pitch_joint
    - thigh_r_active_joint
    - shin_r_active_joint
    - ankle_r_roll_joint
    - ankle_r_yaw_joint
    - hip_l_roll_joint
    - hip_l_pitch_joint
    - thigh_l_active_joint
    - shin_l_active_joint
    - ankle_l_roll_joint
    - ankle_l_yaw_joint
