# time parameter

mov_time: 4.0 # movement time

via_num: 0 # via-point number
via_time: [4.0] # via-point time

# via-point pose [deg]

via_pose:
  1: [0.0] # shoulder_r_pitch
  2: [0.0] # shoulder_l_pitch
  3: [0.0] # shoulder_r_roll
  4: [0.0] # shoulder_l_roll
  5: [0.0] # r_el
  6: [0.0] # l_el
  7: [0.0] # ankle_r_yaw
  8: [0.0] # ankle_l_yaw
  9: [0.0] # hip_r_roll
  10: [0.0] # hip_l_roll
  11: [0.0] # hip_r_pitch
  12: [0.0] # hip_l_pitch
  13: [0.0] # thigh_r_front_active
  14: [0.0] # thigh_l_front_active
  15: [0.0] # shin_r_active
  16: [0.0] # shin_l_active
  17: [0.0] # ankle_r_roll
  18: [0.0] # ankle_l_roll

# target pose [deg]

tar_pose:
  1: 0 # shoulder_r_pitch
  2: 0 # shoulder_l_pitch
  3: 60 # shoulder_r_roll
  4: -60 # shoulder_l_roll
  5: 0 # r_el
  6: 0 # l_el
  7: 0 # ankle_r_yaw
  8: 0 # ankle_l_yaw
  9: 0 # hip_r_roll
  10: 0 # hip_l_roll
  11: 60 # hip_r_pitch
  12: -60 # hip_l_pitch
  13: -146 # thigh_r_front_active
  14: 146 # thigh_l_front_active
  15: -60 # shin_r_active
  16: 60 # shin_l_active
  17: 0 # ankle_r_roll
  18: 0 # ankle_l_roll
