    joint_trajectory:
      joint_names:
        - chest
        - shoulder_r_pitch
        - shoulder_r_roll
        - elbow_r_front
        - elbow_r_rear
        - shoulder_l_pitch
        - shoulder_l_roll
        - elbow_l_front
        - elbow_l_rear
        - hip_r_roll
        - hip_r_pitch
        - knee_r_rear
        - shin_r_rear
        - ankle_r_roll
        - ankle_r_yaw
        - hip_l_roll
        - hip_l_pitch
        - knee_l_rear
        - shin_l_rear
        - ankle_l_roll
        - ankle_l_yaw
