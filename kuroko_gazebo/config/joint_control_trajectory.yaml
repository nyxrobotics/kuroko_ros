# Publish all joint states -----------------------------------
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 1000

# Position Controllers ---------------------------------------
trajectory_controller:
  type: "position_controllers/JointTrajectoryController"
  stop_trajectory_duration: 100
  state_publish_rate: 1000
  action_monitor_rate: 100
  allow_partial_joints_goal: True
  joints:
    - waist
    - shoulder_r_pitch
    - shoulder_r_roll
    - elbow_r_front
    - elbow_r_rear
    - shoulder_l_pitch
    - shoulder_l_roll
    - elbow_l_front
    - elbow_l_rear
    - hip_r_roll_joint
    - hip_r_pitch_joint
    - thigh_r_front_active_joint
    - shin_r_active_joint
    - ankle_r_roll_joint
    - ankle_r_yaw_joint
    - hip_l_roll_joint
    - hip_l_pitch_joint
    - thigh_l_front_active_joint
    - shin_l_active_joint
    - ankle_l_roll_joint
    - ankle_l_yaw_joint
